<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>INFLATION MACHINE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">IDLE SLOT WORK GAME</p>
        <h1>INFLATION<br><span>MACHINE</span></h1>
      </div>
      <button id="resetBtn" class="ghost">RESET</button>
    </header>

    <section class="stats">
      <div class="stat"><span>ENERGY</span><strong id="energy">0</strong></div>
      <div class="stat"><span>PER SPIN</span><strong id="perSpin">10</strong></div>
      <div class="stat"><span>CORE</span><strong id="core">0</strong></div>
    </section>

    <section class="machine">
      <div class="reels">
        <div class="reel" id="r1">7</div>
        <div class="reel" id="r2">7</div>
        <div class="reel" id="r3">7</div>
      </div>
      <div id="message" class="message">SPIN TO INFLATE</div>
      <button id="spinBtn" class="spin">SPIN <small>+ ENERGY</small></button>
    </section>

    <section class="upgrades">
      <h2>UPGRADES</h2>
      <button class="upgrade" id="powerBtn">
        <span><b>POWER ×2</b><small>Spin reward doubles</small></span>
        <strong id="powerCost">100</strong>
      </button>
      <button class="upgrade" id="autoBtn">
        <span><b>AUTO MACHINE</b><small>Earn every second</small></span>
        <strong id="autoCost">1,000</strong>
      </button>
      <button class="upgrade" id="luckBtn">
        <span><b>LUCK +5%</b><small>Better chance for jackpots</small></span>
        <strong id="luckCost">10,000</strong>
      </button>
      <button class="upgrade" id="coreBtn">
        <span><b>CORE RESET</b><small>Reset Energy, gain permanent Core</small></span>
        <strong id="coreNeed">1e6</strong>
      </button>
    </section>

    <footer>
      <span>Local save enabled</span>
      <span id="income">0 / sec</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
